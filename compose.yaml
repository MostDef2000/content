# Фиксированное имя compose-проекта = текущий работающий стек (контейнеры
# valery-comfyui-1/valery-manager-1, образ valery-comfyui); без него
# `docker compose up -d` из /opt/content создаст ВТОРОЙ проект "content"
# и упадёт на конфликте портов 8188/8000 (решение 2026-10-10, транспорт lane A).
name: valery

services:
  comfyui:
    build:
      context: .
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:13.0.1-cudnn-runtime-ubuntu24.04}
        COMFYUI_REF: ${COMFYUI_REF:-master}
    gpus: all
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: backend:cudaMallocAsync
    volumes:
      - /opt/sea-speed-worker/valery/runtime/models:/opt/ComfyUI/models
      - /opt/sea-speed-worker/valery/runtime/input:/opt/ComfyUI/input
      - /opt/sea-speed-worker/valery/runtime/output:/opt/ComfyUI/output
      - /opt/sea-speed-worker/valery/runtime/user:/opt/ComfyUI/user
      - ./comfy:/workspace/workflows:ro
    shm_size: "8gb"
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: management/Dockerfile
    gpus: all
    ports:
      - "${MANAGER_PORT:-8000}:8000"
    environment:
      COMFY_URL: http://comfyui:8188
      WORKSPACE: /workspace
    # Issue #16: runtime- и per-model данные gitignored — свежий клон lane-A
    # (/opt/content) их не содержит, менеджер «слеп» к рабочим данным; биндим
    # каталоги сервера напрямую. Per-model маунты — временно, до #17 (DATA_ROOT).
    # До #17 операционные запреты (см. issue #16, комментарий 6206133465):
    # новые модели НЕ создавать (данные уйдут в эфемерный чекаут), удаление
    # моделей не выполнять (os.replace в trash = кросс-fs EXDEV).
    volumes:
      - .:/workspace
      - /opt/sea-speed-worker/valery/runtime:/workspace/runtime
      - /opt/sea-speed-worker/valery/models/valery23/dataset:/workspace/models/valery23/dataset
      - /opt/sea-speed-worker/valery/models/valery23/posts:/workspace/models/valery23/posts
      - /opt/sea-speed-worker/valery/models/valery23/posts-private:/workspace/models/valery23/posts-private
      - /opt/sea-speed-worker/valery/models/valery23/reference:/workspace/models/valery23/reference
      - /opt/sea-speed-worker/valery/models/valery23/lora/output:/workspace/models/valery23/lora/output
      - /opt/sea-speed-worker/valery/ai-toolkit:/workspace/ai-toolkit
      - /opt/sea-speed-worker/valery/kohya:/workspace/kohya
      - /var/run/docker.sock:/var/run/docker.sock
    shm_size: "8gb"
    restart: unless-stopped
