# Фиксированное имя compose-проекта = текущий работающий стек (контейнеры
# valery-comfyui-1/valery-manager-1, образ valery-comfyui); без него
# `docker compose up -d` из /opt/content создаст ВТОРОЙ проект "content"
# и упадёт на конфликте портов 8188/8000 (решение 2026-10-10, транспорт lane A).
name: valery

services:
  comfyui:
    build:
      context: .
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:13.0.1-cudnn-runtime-ubuntu24.04}
        COMFYUI_REF: ${COMFYUI_REF:-master}
    gpus: all
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: backend:cudaMallocAsync
    volumes:
      - /opt/sea-speed-worker/valery/runtime/models:/opt/ComfyUI/models
      - /opt/sea-speed-worker/valery/runtime/input:/opt/ComfyUI/input
      - /opt/sea-speed-worker/valery/runtime/output:/opt/ComfyUI/output
      - /opt/sea-speed-worker/valery/runtime/user:/opt/ComfyUI/user
      - ./comfy:/workspace/workflows:ro
    shm_size: "8gb"
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: management/Dockerfile
    gpus: all
    ports:
      - "${MANAGER_PORT:-8000}:8000"
    environment:
      COMFY_URL: http://comfyui:8188
      WORKSPACE: /workspace
      # Trainer OOM fix (2026-10-24): TE-cache/training passes died with
      # CUBLAS_STATUS_ALLOC_FAILED even on a mostly-idle GPU (61 MiB free,
      # YOLO resident) — the caching allocator could not recover the
      # fragmented 11.5 GiB pool. expandable_segments allows segment
      # reclamation; verified live: 1500-step FLUX train at 9.7 GiB with
      # comfy+YOLO up.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # Issue #17: per-model DATA (reference/dataset/posts/posts-private/
      # lora-output) and the runtime tree (jobs/loras/trash/output/input)
      # resolve under VALERY_DATA_ROOT; WORKSPACE stays the tracked checkout.
      VALERY_DATA_ROOT: /data
      # Issue #1: registry is runtime state on the data volume — deploys
      # re-checkout WORKSPACE and must not clobber or be blocked by it.
      VALERY_REGISTRY_PATH: /data/runtime/registry.json
    volumes:
      - .:/workspace
      # Data volume: /data maps 1:1 onto the prod valery tree
      # (/opt/sea-speed-worker/valery/{models/<model_id>,runtime}), plus the
      # per-model mounts of #16 are gone. The ai-toolkit bind below stays:
      # train_lora.sh reads the toolkit via its checkout path
      # (TOOLKIT=${ROOT}/ai-toolkit = /workspace/ai-toolkit), not DATA_ROOT.
      - /opt/sea-speed-worker/valery:/data
      - /opt/sea-speed-worker/valery/ai-toolkit:/workspace/ai-toolkit
      - /opt/sea-speed-worker/valery/kohya:/workspace/kohya
      - /var/run/docker.sock:/var/run/docker.sock
    shm_size: "8gb"
    restart: unless-stopped
