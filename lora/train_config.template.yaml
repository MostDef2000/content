---
# Rendered by scripts/train_lora.sh: {{MODEL_ID}} -> <model id>, written to
# runtime/train/<model id>.yaml before launching ai-toolkit.
job: extension
config:
  name: "{{MODEL_ID}}_sdxl_v1"
  process:
    - type: sd_trainer
      training_folder: ../models/{{MODEL_ID}}/lora/output
      device: cuda:0
      trigger_word: "{{MODEL_ID}}"
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        - folder_path: ../models/{{MODEL_ID}}/dataset/images
          caption_ext: txt
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: 768
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: ddpm
        optimizer: adamw8bit
        lr: 0.0001
        skip_first_sample: true
        disable_sampling: true
        ema_config:
          use_ema: false
        dtype: bf16
      model:
        name_or_path: ../runtime/models/checkpoints/ponyDiffusionV6XL.safetensors
        arch: sdxl
        dtype: bf16
meta:
  name: "[name]"
  version: "1.0"
